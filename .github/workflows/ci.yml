name: CI

on:
  push:
    branches: ["main"]
  # Deliberately unfiltered by base branch. Filtering on `branches: ["main"]` silently skips
  # validation for a stacked pull request, since its base is the branch below it in the stack rather
  # than main — the checks list shows only the third-party ones, which reads as "CI passed" at a
  # glance. Push is still limited to main, so a branch with an open PR is validated once, not twice.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate (format + lint + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run turbo validate
        run: pnpm turbo run validate

      - name: Dogfood — score the root README against the readme profile
        run: node packages/prosemeter/dist/cli/index.js score README.md --profile readme --threshold 70
